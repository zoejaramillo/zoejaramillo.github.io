<!doctype html>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      font: 16px/1.6 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      padding-top: 82px;
      background-color: #000000;
      color: white;
    }

    html {
      scroll-padding-top: 90px;
    }

    .site-nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background-color: #000000;
      border-bottom: 1px solid #333333;
      z-index: 1000;
      padding: 22px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-sizing: border-box;
    }

    .site-nav .home-link {
      font-family: 'Archivo Black', sans-serif;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 1.2em;
      color: white;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .site-nav .home-link:hover {
      color: #4a9eff;
    }

    .site-nav .nav-links {
      display: flex;
      gap: 40px;
    }

    .site-nav .nav-links a {
      margin: 0;
      color: #888888;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
      font-size: 0.9em;
      padding: 0;
      border: none;
      transition: color 0.2s ease;
    }

    .site-nav .nav-links a:hover {
      color: #4a9eff;
    }

    /* ===== Title / Hero section ===== */

    .title-hero {
      width: 100%;
      height: calc(100vh - 82px);
      background-color: #000000;
      background-image: url('images/photointegra.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
    }

    .title-hero h1 {
      margin: 0;
      font-family: 'Archivo Black', sans-serif;
      font-weight: 400;
      text-transform: uppercase;
      color: white;
      font-size: 4.5em;
      letter-spacing: 1px;
      line-height: 1.05;
      max-width: 1100px;
      padding: 0 20px;
      position: relative;
      z-index: 1;
    }

  </style>

<nav class="site-nav">
